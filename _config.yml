# Site settings
title: FAM
email: famartwork@gmail.com
description: >-
  FAM, contemporary painter. Oil paintings, watercolours and the 404 series:
  works, exhibitions and contact.
locale: en_US
lang: en
legal_ready: false
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://famvisualarts.github.io" # "https://famofficially.github.io" #"https://farah-cherif.github.io" # the base hostname & protocol for your site
facebook_username: famvisualarts
twitter_username: famvisualarts
instagram_username: famvisualarts


# Build settings
markdown: kramdown
permalink: pretty
#theme ci dessous mis en commebtaire car erreur de lancer jekyll
#theme: jekyll-theme-cayman

exclude:
  - TODELET-illustrations.md
  - TODELET-illustrations_jeunesse.md
  - TODELETE-biographie.md
  - TODELETE-demarche.md
  - "other-posts not published yet"
  - "pending_post_to post_later"
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - urban.gemspec
  - vendor
  - tools
  - SHOP.md
  # Legal pages stay unpublished until the seller details are filled in (then remove these two lines and set legal_ready: true)
  - legal
  - fr/legal


defaults:
- scope:
    path: ''
  values:
    lang: en
- scope:
    path: 'fr'
  values:
    lang: fr
    locale: fr_FR
    description: "FAM, artiste peintre contemporaine. Peintures à l'huile, aquarelles et série 404 : œuvres, expositions et contact."