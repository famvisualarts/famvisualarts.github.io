<header class="page-head">
  <h1 class="page-title" data-fr="Page introuvable">Page not found</h1>
</header>
<div class="prose">
  <p data-fr="Cette page n’existe pas ou a changé d’adresse.">This page does not exist or has moved.</p>
  <p><a class="text-link" href="{{ '/gallery/' | relative_url }}" data-fr-href="{{ '/fr/gallery/' | relative_url }}" data-fr-text="Voir les œuvres">See the works</a></p>
</div>
<script>
  // French visitors (browser or previous visit) get French text
  try {
    var fr = (localStorage.getItem('famLang') || navigator.language || '').slice(0, 2) === 'fr';
    if (fr) document.querySelectorAll('[data-fr],[data-fr-href]').forEach(function (el) {
      if (el.dataset.fr) el.textContent = el.dataset.fr;
      if (el.dataset.frHref) { el.href = el.dataset.frHref; el.textContent = el.dataset.frText; }
    });
  } catch (e) {}
</script>
