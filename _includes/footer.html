{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
<footer class="site-footer">
  <ul>
    <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
    <li><a href="https://www.instagram.com/famvisualarts" rel="noopener">Instagram</a></li>
    <li><a href="https://www.facebook.com/famvisualarts" rel="noopener">Facebook</a></li>
  </ul>
  {% if site.legal_ready %}<ul class="footer-legal">
    <li><a href="{{ t.prefix | append: '/legal/shipping/' | relative_url }}">{{ t.shop.shipping }}</a></li>
    <li><a href="{{ t.prefix | append: '/legal/terms/' | relative_url }}">{{ t.shop.terms }}</a></li>
    <li><a href="{{ t.prefix | append: '/legal/notice/' | relative_url }}">{{ t.shop.legal }}</a></li>
  </ul>{% endif %}
  <p style="margin:0">&copy; {{ 'now' | date: '%Y' }} FAM. {{ t.rights }}</p>
</footer>
